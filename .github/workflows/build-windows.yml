name: Build Windows Offline Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/build-windows.yml"
      - "README.md"
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: docling-windows-installer
  cancel-in-progress: false

jobs:
  windows-installer:
    name: Windows x64 - bundle, test, package
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout independent installer project
        uses: actions/checkout@v4

      - name: Show runner prerequisites
        run: |
          Write-Host "OS: $([Environment]::OSVersion.VersionString)"
          Get-PSDrive C
          nuget help | Select-Object -First 4
          $iscc = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup 6 not installed on runner" }
          Write-Host "Inno Setup found: $iscc"

      - name: Build and smoke-test complete offline installer
        run: ./windows/build.ps1

      - name: Verify all offline installer volumes and write integrity manifest
        run: |
          $parts = @(Get-ChildItem -Path "./dist" -File | Where-Object { $_.Extension -in @(".exe", ".bin") } | Sort-Object Name)
          $setup = $parts | Where-Object { $_.Name -eq "Docling-Stage2B-Offline-Setup.exe" }
          $slices = @($parts | Where-Object { $_.Extension -eq ".bin" })
          if (-not $setup -or $slices.Count -lt 1) {
            throw "Missing Setup.exe or offline BIN slices. A partial installer must never be published."
          }
          $manifest = @($parts | ForEach-Object {
            if ($_.Length -le 0) { throw "Empty installer file: $($_.Name)" }
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
            Write-Host ("{0}: {1:N2} GiB" -f $_.Name, ($_.Length / 1GB))
            "$hash  $($_.Name)"
          })
          $manifest | Set-Content "./dist/SHA256SUMS.txt" -Encoding ascii

      - name: Upload installer for download
        uses: actions/upload-artifact@v4
        with:
          name: Docling-Stage2B-Windows-x64-Offline
          path: dist/*
          # One downloadable GitHub artifact ZIP contains Setup.exe + all BIN
          # volumes. Extract them together for installation without internet.
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Publish release assets when a GitHub release is published
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
